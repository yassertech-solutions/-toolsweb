<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpiderTools Cyber Dashboard</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial;
}

body{
  background:black;
  color:white;
  overflow-x:hidden;
}

/* 🌌 MATRIX BACKGROUND */
.matrix{
  position:fixed;
  width:100%;
  height:100%;
  z-index:-3;
  background:black;
  overflow:hidden;
}

.matrix span{
  position:absolute;
  top:-50px;
  color:#0f0;
  font-size:14px;
  animation:fall linear infinite;
  opacity:0.5;
}

@keyframes fall{
  to{transform:translateY(110vh);}
}

/* SIDE BAR */
.sidebar{
  position:fixed;
  width:220px;
  height:100%;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(12px);
  border-right:1px solid rgba(0,255,255,0.2);
  padding:20px;
}

.logo{
  text-align:center;
  margin-bottom:20px;
}

.logo img{
  width:80px;
  height:80px;
  border-radius:50%;
  border:2px solid cyan;
  box-shadow:0 0 15px cyan;
}

.logo h2{
  margin-top:10px;
  color:cyan;
}

/* MENU */
.menu a{
  display:block;
  padding:10px;
  margin:8px 0;
  color:white;
  text-decoration:none;
  border-radius:8px;
  transition:0.3s;
}

.menu a:hover{
  background:rgba(0,255,255,0.1);
  color:cyan;
}

/* MAIN */
.main{
  margin-left:240px;
  padding:20px;
}

/* HEADER */
.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px;
  background:rgba(0,0,0,0.5);
  border:1px solid rgba(0,255,255,0.2);
  border-radius:12px;
}

.top h1{
  color:cyan;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
  margin-top:20px;
}

/* GLASS CARD */
.card{
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(0,255,255,0.2);
  backdrop-filter:blur(12px);
  padding:15px;
  border-radius:15px;
  box-shadow:0 0 10px rgba(0,255,255,0.1);
  transition:0.3s;
}

.card:hover{
  transform:translateY(-8px);
  box-shadow:0 0 20px cyan, 0 0 20px red;
}

/* BUTTON */
.btn{
  display:block;
  margin-top:10px;
  padding:10px;
  text-align:center;
  border-radius:10px;
  background:linear-gradient(90deg,red,cyan);
  color:white;
  text-decoration:none;
  font-weight:bold;
}

/* RESPONSIVE */
@media(max-width:800px){
  .sidebar{width:100px}
  .main{margin-left:120px}
  .logo h2{font-size:12px}
}
</style>
</head>

<body>

<!-- MATRIX BACKGROUND -->
<div class="matrix" id="matrix"></div>

<!-- SIDEBAR -->
<div class="sidebar">

  <div class="logo">
    <img src="https://files.catbox.moe/tj4eru.jpg">
    <h2>SpiderTools</h2>
  </div>

  <div class="menu">
    <a href="#">🏠 Home</a>
    <a href="#">📱 Apps</a>
    <a href="#">🤖 Bots</a>
    <a href="#">🧠 AI Tools</a>
    <a href="#">📂 Scripts</a>
    <a href="#">📞 Contact</a>
  </div>

</div>

<!-- MAIN -->
<div class="main">

  <div class="top">
    <h1>⚡ Cyber Dashboard</h1>
    <p>Red × Cyan Edition</p>
  </div>

  <!-- APPS -->
  <h2 style="margin-top:20px;color:cyan;">📱 Apps</h2>
  <div class="grid">

    <div class="card">
      <h3>PPSSPP Gold</h3>
      <a class="btn" href="#">Download</a>
    </div>

    <div class="card">
      <h3>CapCut Pro</h3>
      <a class="btn" href="#">Download</a>
    </div>

    <div class="card">
      <h3>Telegram Premium</h3>
      <a class="btn" href="#">Download</a>
    </div>

  </div>

  <!-- BOTS -->
  <h2 style="margin-top:20px;color:red;">🤖 Bots</h2>
  <div class="grid">

    <div class="card">
      <h3>Server 1</h3>
      <a class="btn" href="#">Open</a>
    </div>

    <div class="card">
      <h3>Server 2</h3>
      <a class="btn" href="#">Open</a>
    </div>

    <div class="card">
      <h3>Server 3</h3>
      <a class="btn" href="#">Open</a>
    </div>

  </div>

</div>

<script>

/* MATRIX EFFECT */
const matrix=document.getElementById("matrix");

const chars="01";

for(let i=0;i<80;i++){
  let span=document.createElement("span");
  span.innerText=chars[Math.floor(Math.random()*chars.length)];
  span.style.left=Math.random()*100+"vw";
  span.style.animationDuration=(3+Math.random()*5)+"s";
  span.style.fontSize=(10+Math.random()*20)+"px";
  matrix.appendChild(span);
}

</script>

</body>
</html>
